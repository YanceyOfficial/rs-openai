[package]
name = "rs_openai"
version = "0.8.0"
edition.workspace = true
rust-version.workspace = true
authors = ["Yancey Leo <developer@yanceyleo.com>"]
description = "The OpenAI Rust library provides convenient access to the OpenAI API from Rust applications."
repository = "https://github.com/YanceyOfficial/rs-openai"
homepage = "https://yanceyleo.com"
license = "MIT"
keywords = ["openai"]
readme = "../README.md"

[lints]
workspace = true

[dependencies]
futures = { workspace = true }
reqwest = { workspace = true }
reqwest-eventsource = "0.6.0"
# pinned below latest: newer versions require reqwest 0.13, which conflicts with
# reqwest-eventsource (reqwest 0.12-only, see SSE streaming in post_stream)
reqwest-middleware = { version = "0.4", features = ["json", "multipart"] }
reqwest-retry = "0.7"
serde = { workspace = true }
serde_json = { workspace = true }
strum = { version = "0.26.3", features = ["derive"] }
thiserror = "2"
tokio = { workspace = true }
tokio-stream = "0.1.12"
rand = "0.8.5"
bon = "3.9.3"
base64 = "0.23"
hmac = "0.13"
sha2 = "0.11"

[dev-dependencies]
wiremock = "0.6.5"
